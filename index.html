<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#173b32">
  <title>Terminy ważności — wspólna lista</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#1c2925;background:#f3f6f4}
    *{box-sizing:border-box}body{margin:0}header{background:#173b32;color:#fff;padding:22px 16px}
    .wrap{max-width:1050px;margin:auto;padding:0 16px}h1{font-size:clamp(22px,4vw,30px);margin:0 0 5px}
    header p{margin:0;color:#d6e5df}.status{font-size:13px;margin-top:10px;color:#e6f4ec}
    main{padding:22px 0 50px}.panel{background:#fff;border:1px solid #dce5df;border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 2px 8px #173b3209}
    h2{font-size:18px;margin:0 0 14px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
    label{display:block;font-size:13px;font-weight:650;margin-bottom:6px}input,select,button{font:inherit}
    input[type=text],input[type=date],input[type=search],select{width:100%;padding:11px 12px;border:1px solid #cbd7d0;border-radius:9px;background:#fff;color:#1c2925}
    input[type=file]{width:100%;font-size:13px}.hint{font-size:12px;color:#64736c;margin-top:5px}
    .actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.btn{border:0;border-radius:9px;padding:10px 15px;font-weight:650;cursor:pointer}
    .primary{background:#176b4d;color:white}.secondary{background:#e9efeb;color:#23382f}.danger{background:#fff0ed;color:#a12d1e}
    button:disabled{opacity:.55;cursor:wait}.toolbar{display:grid;grid-template-columns:1fr 190px;gap:10px;margin-bottom:14px}
    .list{display:grid;gap:10px}.item{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:13px;align-items:center;padding:12px;border:1px solid #e0e8e3;border-radius:12px}
    .thumb{width:76px;height:76px;object-fit:cover;border-radius:9px;background:#edf2ee;cursor:zoom-in}
    .placeholder{width:76px;height:76px;border-radius:9px;background:#edf2ee;display:grid;place-items:center;color:#829188;font-size:11px;text-align:center}
    .name{font-weight:750;overflow-wrap:anywhere}.date{font-size:13px;color:#52645b;margin-top:4px}
    .tag{display:inline-block;border-radius:20px;padding:3px 8px;font-size:11px;font-weight:700;margin-top:6px}
    .ok{background:#e2f4e9;color:#17633e}.soon{background:#fff0d7;color:#895300}.expired{background:#ffe5e1;color:#a12d1e}
    .item-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.small{padding:8px 10px;font-size:12px}
    .empty{text-align:center;color:#697970;padding:28px 8px}.muted{color:#6c7a72;font-size:13px}
    .preview{display:none;width:90px;height:90px;object-fit:cover;border-radius:9px;margin-top:9px}
    .modal{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;padding:20px;z-index:10}
    .modal.open{display:flex}.modal img{max-width:min(95vw,1000px);max-height:88vh;object-fit:contain;border-radius:8px}
    .close{position:absolute;right:18px;top:14px;background:#fff;border:0;border-radius:50%;width:42px;height:42px;font-size:25px;cursor:pointer}
    .notice{font-size:12px;color:#66766d;margin-top:12px;line-height:1.5}
    @media(max-width:650px){.grid{grid-template-columns:1fr}.toolbar{grid-template-columns:1fr}.item{grid-template-columns:60px minmax(0,1fr)}.thumb,.placeholder{width:60px;height:60px}.item-actions{grid-column:2;justify-content:flex-start}.panel{padding:14px}}
  </style>
</head>
<body>
<header><div class="wrap">
  <h1>Terminy ważności produktów</h1>
  <p>Wspólna lista dla pracowników sklepu</p>
  <div class="status" id="connection">Łączenie z bazą danych…</div>
</div></header>

<main class="wrap">
  <section class="panel">
    <h2 id="formTitle">Dodaj produkt</h2>
    <form id="productForm">
      <div class="grid">
        <div><label for="productName">Nazwa produktu</label><input id="productName" type="text" maxlength="160" placeholder="Np. Mleko 3,2%" required></div>
        <div><label for="expiryDate">Data ważności</label><input id="expiryDate" type="date" required></div>
        <div><label for="photo">Zdjęcie produktu (opcjonalnie)</label><input id="photo" type="file" accept="image/*"><div class="hint">Zdjęcie zostanie zmniejszone przed wysłaniem.</div><img id="preview" class="preview" alt="Podgląd zdjęcia"></div>
      </div>
      <div class="actions">
        <button class="btn primary" id="saveBtn" type="submit">Dodaj produkt</button>
        <button class="btn secondary" id="cancelBtn" type="button" hidden>Anuluj edycję</button>
      </div>
    </form>
    <div class="notice">Lista synchronizuje się automatycznie między urządzeniami. Nie zamykaj strony podczas wysyłania zdjęcia.</div>
  </section>

  <section class="panel">
    <h2>Lista produktów</h2>
    <div class="toolbar">
      <input id="search" type="search" placeholder="Szukaj produktu…">
      <select id="filter">
        <option value="all">Wszystkie produkty</option>
        <option value="expired">Po terminie</option>
        <option value="soon">Ważne do 7 dni</option>
        <option value="ok">Powyżej 7 dni</option>
      </select>
    </div>
    <div class="muted" id="count"></div>
    <div class="list" id="productList"><div class="empty">Pobieranie produktów…</div></div>
  </section>
</main>

<div class="modal" id="photoModal" role="dialog" aria-modal="true" aria-label="Zdjęcie produktu">
  <button class="close" id="closeModal" aria-label="Zamknij">×</button>
  <img id="modalImage" alt="Zdjęcie produktu">
</div>

<script>
(() => {
  const SUPABASE_URL = "https://gronmeaxacedjwdjfnlp.supabase.co";
  const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_cgAw5bfl1cwuSfJsnoPrXg_6PvaaUd8";
  const TABLE = "products";
  const BUCKET = "product-photos";
  const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

  const $ = id => document.getElementById(id);
  const form = $("productForm"), nameInput = $("productName"), dateInput = $("expiryDate");
  const photoInput = $("photo"), preview = $("preview"), list = $("productList");
  let products = [], editingId = null, editingPhotoPath = null, selectedFile = null, channel = null;

  const todayISO = () => {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  };
  const dayDiff = date => {
    const [y,m,d] = date.split("-").map(Number);
    const target = Date.UTC(y,m-1,d);
    const now = new Date(); const today = Date.UTC(now.getFullYear(),now.getMonth(),now.getDate());
    return Math.round((target-today)/86400000);
  };
  const escapeHtml = value => String(value ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const prettyDate = date => {
    const [y,m,d] = date.split("-");
    return `${d}.${m}.${y}`;
  };
  function statusFor(date) {
    const n = dayDiff(date);
    if (n < 0) return {key:"expired", text:`Po terminie o ${Math.abs(n)} dni`};
    if (n <= 7) return {key:"soon", text:n === 0 ? "Termin upływa dzisiaj" : `Pozostało ${n} dni`};
    return {key:"ok", text:`Pozostało ${n} dni`};
  }
  function setConnection(message, good=false) {
    $("connection").textContent = message;
    $("connection").style.color = good ? "#c5f3d5" : "#ffe2b9";
  }
  async function loadProducts() {
    const {data,error} = await client.from(TABLE).select("*").order("expiry_date",{ascending:true});
    if (error) throw error;
    products = data || [];
    render();
  }
  function render() {
    const query = $("search").value.trim().toLocaleLowerCase("pl");
    const filter = $("filter").value;
    const shown = products.filter(p => {
      const status = statusFor(p.expiry_date).key;
      return p.name.toLocaleLowerCase("pl").includes(query) && (filter === "all" || status === filter);
    });
    $("count").textContent = `Widoczne: ${shown.length} · Łącznie: ${products.length}`;
    if (!shown.length) {
      list.innerHTML = `<div class="empty">${products.length ? "Brak produktów pasujących do wyszukiwania." : "Lista jest pusta. Dodaj pierwszy produkt powyżej."}</div>`;
      return;
    }
    list.innerHTML = shown.map(p => {
      const s = statusFor(p.expiry_date);
      const photo = p.photo_url
        ? `<img class="thumb" src="${escapeHtml(p.photo_url)}" alt="Zdjęcie ${escapeHtml(p.name)}" data-photo="${escapeHtml(p.photo_url)}">`
        : `<div class="placeholder">Brak<br>zdjęcia</div>`;
      return `<article class="item">
        ${photo}
        <div><div class="name">${escapeHtml(p.name)}</div>
          <div class="date">Data ważności: <strong>${prettyDate(p.expiry_date)}</strong></div>
          <span class="tag ${s.key}">${s.text}</span>
        </div>
        <div class="item-actions">
          <button class="btn secondary small" data-edit="${p.id}">Edytuj</button>
          <button class="btn danger small" data-delete="${p.id}">Usuń</button>
        </div>
      </article>`;
    }).join("");
  }
  function resetForm() {
    form.reset(); editingId = null; editingPhotoPath = null; selectedFile = null;
    preview.removeAttribute("src"); preview.style.display = "none";
    $("formTitle").textContent = "Dodaj produkt";
    $("saveBtn").textContent = "Dodaj produkt";
    $("cancelBtn").hidden = true;
  }
  function compressImage(file) {
    return new Promise((resolve,reject) => {
      const img = new Image(), url = URL.createObjectURL(file);
      img.onload = () => {
        const max = 1800, scale = Math.min(1,max/Math.max(img.width,img.height));
        const canvas = document.createElement("canvas");
        canvas.width = Math.max(1,Math.round(img.width*scale));
        canvas.height = Math.max(1,Math.round(img.height*scale));
        canvas.getContext("2d").drawImage(img,0,0,canvas.width,canvas.height);
        URL.revokeObjectURL(url);
        canvas.toBlob(blob => blob ? resolve(blob) : reject(new Error("Nie udało się przetworzyć zdjęcia.")),"image/jpeg",0.88);
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("Nie można odczytać zdjęcia.")); };
      img.src = url;
    });
  }
  async function uploadPhoto(file) {
    const blob = await compressImage(file);
    const path = `${crypto.randomUUID()}.jpg`;
    const {error} = await client.storage.from(BUCKET).upload(path,blob,{contentType:"image/jpeg",upsert:false});
    if (error) throw error;
    const {data} = client.storage.from(BUCKET).getPublicUrl(path);
    return {path,url:data.publicUrl};
  }
  async function removePhoto(path) {
    if (!path) return;
    const {error} = await client.storage.from(BUCKET).remove([path]);
    if (error) console.warn("Nie udało się usunąć starego zdjęcia:",error.message);
  }
  form.addEventListener("submit", async e => {
    e.preventDefault();
    const name = nameInput.value.trim(), expiry_date = dateInput.value;
    if (!name || !expiry_date) return;
    const btn = $("saveBtn"); btn.disabled = true; btn.textContent = "Zapisywanie…";
    let uploaded = null;
    try {
      if (selectedFile) uploaded = await uploadPhoto(selectedFile);
      const payload = {name,expiry_date};
      if (uploaded) { payload.photo_url = uploaded.url; payload.photo_path = uploaded.path; }
      if (editingId) {
        const {error} = await client.from(TABLE).update(payload).eq("id",editingId);
        if (error) throw error;
        if (uploaded && editingPhotoPath) await removePhoto(editingPhotoPath);
      } else {
        const {error} = await client.from(TABLE).insert(payload);
        if (error) throw error;
      }
      resetForm();
      await loadProducts();
      setConnection("Połączono · zmiany są synchronizowane na bieżąco",true);
    } catch (err) {
      if (uploaded) await removePhoto(uploaded.path);
      alert("Nie udało się zapisać produktu: " + (err.message || err));
    } finally {
      btn.disabled = false;
      btn.textContent = editingId ? "Zapisz zmiany" : "Dodaj produkt";
    }
  });
  photoInput.addEventListener("change", () => {
    selectedFile = photoInput.files?.[0] || null;
    if (selectedFile) {
      preview.src = URL.createObjectURL(selectedFile);
      preview.style.display = "block";
    } else {
      preview.style.display = "none";
      preview.removeAttribute("src");
    }
  });
  $("cancelBtn").addEventListener("click",resetForm);
  list.addEventListener("click", async e => {
    const photo = e.target.closest("[data-photo]");
    if (photo) { $("modalImage").src = photo.dataset.photo; $("photoModal").classList.add("open"); return; }
    const edit = e.target.closest("[data-edit]");
    if (edit) {
      const p = products.find(x => x.id === edit.dataset.edit); if (!p) return;
      editingId = p.id; editingPhotoPath = p.photo_path || null;
      nameInput.value = p.name; dateInput.value = p.expiry_date;
      selectedFile = null; photoInput.value = "";
      if (p.photo_url) { preview.src = p.photo_url; preview.style.display = "block"; }
      else { preview.style.display = "none"; preview.removeAttribute("src"); }
      $("formTitle").textContent = "Edytuj produkt";
      $("saveBtn").textContent = "Zapisz zmiany";
      $("cancelBtn").hidden = false;
      window.scrollTo({top:0,behavior:"smooth"});
      return;
    }
    const del = e.target.closest("[data-delete]");
    if (del) {
      const p = products.find(x => x.id === del.dataset.delete); if (!p) return;
      if (!confirm(`Czy na pewno usunąć produkt „${p.name}”?`)) return;
      del.disabled = true;
      const {error} = await client.from(TABLE).delete().eq("id",p.id);
      if (error) { alert("Nie udało się usunąć produktu: "+error.message); del.disabled = false; return; }
      if (p.photo_path) await removePhoto(p.photo_path);
      await loadProducts();
    }
  });
  function closeModal() { $("photoModal").classList.remove("open"); $("modalImage").removeAttribute("src"); }
  $("closeModal").addEventListener("click",closeModal);
  $("photoModal").addEventListener("click",e => { if (e.target === $("photoModal")) closeModal(); });
  document.addEventListener("keydown",e => { if (e.key === "Escape") closeModal(); });
  $("search").addEventListener("input",render);
  $("filter").addEventListener("change",render);

  async function start() {
    try {
      await loadProducts();
      channel = client.channel("products-live")
        .on("postgres_changes",{event:"*",schema:"public",table:TABLE},async () => {
          try { await loadProducts(); } catch (e) { console.error(e); }
        })
        .subscribe(status => {
          if (status === "SUBSCRIBED") setConnection("Połączono · zmiany są synchronizowane na bieżąco",true);
          else if (status === "CHANNEL_ERROR" || status === "TIMED_OUT") setConnection("Problem z połączeniem na żywo · odśwież stronę");
        });
    } catch (err) {
      setConnection("Błąd połączenia z bazą danych");
      list.innerHTML = `<div class="empty">Nie udało się pobrać produktów.<br>${escapeHtml(err.message || err)}<br><br>Sprawdź, czy wykonałeś instrukcje konfiguracji Supabase.</div>`;
    }
  }
  start();
})();
</script>
</body>
</html>
